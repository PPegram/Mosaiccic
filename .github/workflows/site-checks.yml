name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check committed pages and assets
        run: npm test
      - name: Regenerate pages
        run: npm run build
      - name: Check regenerated pages and assets
        run: npm test
      - name: Reject stale generated HTML
        run: git diff --exit-code -- '*.html'
